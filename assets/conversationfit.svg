<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="ConversationFit project image: a flowing speech waveform with a warm focal point, framed by soft acoustic arcs">
  <title>ConversationFit</title>
  <desc>Abstract illustration of personalised hearing: a confident, speech-like waveform crosses a quiet acoustic field, framed by subtle concentric arcs and centred on a single warm focal point.</desc>

  <defs>
    <style>
      .ink { stroke: #1f6b66; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .warm { fill: #c4502a; }
    </style>
  </defs>

  <!-- Outer acoustic field: "listening lens" of subtle concentric arcs -->
  <g class="ink">
    <!-- Left lens (opens to the right) -->
    <path d="M 130  80 Q  -10 450 130  820" stroke-width="2"   opacity="0.16"/>
    <path d="M 200 150 Q   80 450 200  750" stroke-width="2.5" opacity="0.28"/>
    <path d="M 270 230 Q  180 450 270  670" stroke-width="3"   opacity="0.48"/>

    <!-- Right lens (mirror, opens to the left) -->
    <path d="M 1070  80 Q 1210 450 1070  820" stroke-width="2"   opacity="0.16"/>
    <path d="M 1000 150 Q 1120 450 1000  750" stroke-width="2.5" opacity="0.28"/>
    <path d="M  930 230 Q 1020 450  930  670" stroke-width="3"   opacity="0.48"/>
  </g>

  <!-- Hero waveform: four-bump speech-like wave, varying amplitudes -->
  <g class="ink">
    <path
      d="M 270 450
         C 315 360, 405 360, 450 450
         C 495 590, 585 590, 630 450
         C 675 320, 765 320, 810 450
         C 855 520, 925 520, 930 450"
      stroke-width="10" opacity="0.98"/>
  </g>

  <!-- Soft echo trailing under the wave (whisper of the same shape) -->
  <g class="ink">
    <path
      d="M 270 450
         C 315 415, 405 415, 450 450
         C 495 500, 585 500, 630 450
         C 675 395, 765 395, 810 450
         C 855 475, 925 475, 930 450"
      stroke-width="3" opacity="0.28"/>
  </g>

  <!-- Focal personalisation point: a calm dot in the centre, rings echoing outwards -->
  <g>
    <circle cx="630" cy="450" r="74" fill="none" stroke="#c4502a" stroke-width="1.3" opacity="0.18"/>
    <circle cx="630" cy="450" r="44" fill="none" stroke="#c4502a" stroke-width="1.5" opacity="0.40"/>
    <circle cx="630" cy="450" r="16" class="warm"/>
  </g>

  <!-- Discreet articulation dots, scattered above and below the wave -->
  <g fill="#1f6b66" opacity="0.55">
    <circle cx="380" cy="380" r="4"/>
    <circle cx="530" cy="565" r="4"/>
    <circle cx="740" cy="345" r="4"/>
    <circle cx="870" cy="505" r="4"/>
  </g>
</svg>
